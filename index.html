<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bigo Live - Greedy Wheel Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2uxfVYbNrksWicBrB-g-Ww81u6A70e28",
            authDomain: "greedygamepkk.firebaseapp.com",
            databaseURL: "https://greedygamepkk-default-rtdb.firebaseio.com",
            projectId: "greedygamepkk",
            storageBucket: "greedygamepkk.appspot.com",
            messagingSenderId: "658430310829",
            appId: "1:658430310829:web:69b827e7f9a1f2e9619a89"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = localStorage.getItem("lucky_win_user") || "";
        let roundTimeLeft = 20;
        let gameState = "waiting"; // waiting, spinning, over
        let selectedOption = null;
        let userBetAmount = 0;

        // 8 Wheel Options definition
        const wheelSectors = [
            { id: 0, name: "Veg 1", mult: 5, type: "veg" },
            { id: 1, name: "Veg 2", mult: 5, type: "veg" },
            { id: 2, name: "Veg 3", mult: 5, type: "veg" },
            { id: 3, name: "Veg 4", mult: 5, type: "veg" },
            { id: 4, name: "Burger", mult: 10, type: "food" },
            { id: 5, name: "Kabab Stick", mult: 15, type: "food" },
            { id: 6, name: "Chicken Leg", mult: 25, type: "food" },
            { id: 7, name: "Meat", mult: 45, type: "food" }
        ];

        window.addEventListener("DOMContentLoaded", () => {
            if (currentUser) {
                document.getElementById("auth-screen").classList.add("hidden");
                document.getElementById("game-screen").classList.remove("hidden");
                document.getElementById("display-username").innerText = currentUser;
                listenToBalance(currentUser);
                startBigoBotFeed();
                startWheelGameLoop();
            }
        });

        window.loginUser = function() {
            const usernameInput = document.getElementById("username-input").value.trim();
            const passwordInput = document.getElementById("password-input").value.trim();
            
            if (!usernameInput || !passwordInput) {
                alert("Please enter username and password!");
                return;
            }

            const userRef = ref(db, 'users/' + usernameInput);
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    if (snapshot.val().password === passwordInput) {
                        currentUser = usernameInput;
                        localStorage.setItem("lucky_win_user", currentUser);
                        location.reload();
                    } else {
                        alert("❌ Incorrect Password!");
                    }
                } else {
                    set(userRef, { password: passwordInput, balance: 500.00 });
                    currentUser = usernameInput;
                    localStorage.setItem("lucky_win_user", currentUser);
                    location.reload();
                }
            });
        };

        window.logoutUser = function() {
            localStorage.removeItem("lucky_win_user");
            location.reload();
        };

        function listenToBalance(username) {
            onValue(ref(db, 'users/' + username + '/balance'), (snapshot) => {
                const bal = snapshot.val() !== null ? snapshot.val() : 0;
                document.getElementById("display-balance").innerText = "💎 " + parseFloat(bal).toFixed(2);
                window.currentBalance = parseFloat(bal);
            });
        }

        window.selectBetOption = function(id, name, mult) {
            if (gameState !== "waiting") {
                alert("Betting is closed for this spin!");
                return;
            }
            selectedOption = { id, name, mult };
            document.querySelectorAll(".option-btn").forEach(btn => btn.classList.remove("border-amber-400", "bg-purple-900/60"));
            document.getElementById(`opt-${id}`).classList.add("border-amber-400", "bg-purple-900/60");
            document.getElementById("selected-target-text").innerText = `Selected: ${name} (${mult}x)`;
        };

        function startBigoBotFeed() {
            const feed = document.getElementById("bigo-bot-feed");
            const names = ["King_786", "Queen_Anaya", "BigoStar_Ali", "Diamond_Zain", "Prince_Adeel", "Malik_Live"];
            setInterval(() => {
                const name = names[Math.floor(Math.random() * names.length)];
                const amt = Math.floor(Math.random() * 500) + 100;
                const isWin = Math.random() < 0.40;
                const txt = isWin 
                    ? `<span class="text-emerald-400">💎 ${name} won on Greedy Wheel!</span>`
                    : `<span class="text-rose-400">❌ ${name} lost ${amt} Diamonds</span>`;
                if(feed) feed.innerHTML = txt + "<br>" + feed.innerHTML;
            }, 2500);
        }

        function startWheelGameLoop() {
            setInterval(async () => {
                const statusEl = document.getElementById("bigo-status");

                if (gameState === "waiting") {
                    roundTimeLeft--;
                    if (roundTimeLeft > 0) {
                        statusEl.innerText = `⏱️ Betting Open: ${roundTimeLeft}s remaining`;
                        statusEl.className = "text-center font-bold text-amber-400 text-xs";
                    } else {
                        gameState = "spinning";
                        roundTimeLeft = 20;
                        statusEl.innerText = "🎡 Wheel is spinning...";
                        statusEl.className = "text-center font-bold text-yellow-300 text-xs animate-pulse";

                        // House Edge Logic (60% loss / 40% win)
                        let winningSector;
                        const isUserWin = Math.random() < 0.40;

                        if (isUserWin && selectedOption) {
                            winningSector = selectedOption;
                        } else {
                            // Pick random sector (weighted towards lower 5x veg options to keep house edge)
                            const randRoll = Math.random();
                            if (randRoll < 0.70) {
                                // Veg options (5x)
                                const vegOptions = wheelSectors.filter(s => s.type === "veg");
                                winningSector = vegOptions[Math.floor(Math.random() * vegOptions.length)];
                            } else {
                                // High multipliers
                                const foodOptions = wheelSectors.filter(s => s.type === "food");
                                winningSector = foodOptions[Math.floor(Math.random() * foodOptions.length)];
                            }
                        }

                        // Animate wheel spinning effect visually
                        let spinDisplay = document.getElementById("wheel-center-display");
                        let counter = 0;
                        let spinInterval = setInterval(() => {
                            let randomSec = wheelSectors[Math.floor(Math.random() * wheelSectors.length)];
                            spinDisplay.innerText = randomSec.name;
                            counter++;
                            if (counter > 12) {
                                clearInterval(spinInterval);
                                spinDisplay.innerText = `${winningSector.name} (${winningSector.mult}x)`;
                                resolveSpinResult(winningSector);
                            }
                        }, 150);
                    }
                }
            }, 1000);
        }

        async function resolveSpinResult(winningSector) {
            const statusEl = document.getElementById("bigo-status");
            let userWon = false;

            if (selectedOption && selectedOption.id === winningSector.id) {
                userWon = true;
                const prize = userBetAmount * winningSector.mult;
                let newBal = window.currentBalance + prize;
                await update(ref(db, 'users/' + currentUser), { balance: newBal });
                statusEl.innerText = `🎉 WIN! Wheel landed on ${winningSector.name} (${winningSector.mult}x). Won 💎${prize}`;
                statusEl.className = "text-center font-bold text-emerald-400 text-xs";
            } else if (userBetAmount > 0) {
                statusEl.innerText = `💥 LOST! Wheel landed on ${winningSector.name} (${winningSector.mult}x)`;
                statusEl.className = "text-center font-bold text-rose-500 text-xs";
            } else {
                statusEl.innerText = `📌 Result: ${winningSector.name} (${winningSector.mult}x)`;
                statusEl.className = "text-center font-bold text-purple-300 text-xs";
            }

            // Reset bet for next round
            userBetAmount = 0;
            selectedOption = null;
            document.querySelectorAll(".option-btn").forEach(btn => btn.classList.remove("border-amber-400", "bg-purple-900/60"));
            document.getElementById("selected-target-text").innerText = "Select an item to place bet";

            setTimeout(() => {
                gameState = "waiting";
            }, 3500);
        }

        window.placeWheelBet = async function() {
            if (gameState !== "waiting") { alert("Betting is locked while wheel is spinning!"); return; }
            if (!selectedOption) { alert("Please click and select a wheel option first!"); return; }
            const amt = parseFloat(document.getElementById("user-bet-input").value);
            if (isNaN(amt) || amt <= 0) { alert("Enter valid diamond amount!"); return; }
            if (amt > window.currentBalance) { alert("Insufficient diamonds!"); return; }

            userBetAmount = amt;
            await update(ref(db, 'users/' + currentUser), { balance: window.currentBalance - amt });
            document.getElementById("bigo-status").innerText = `✅ Bet locked on ${selectedOption.name} for 💎${amt}`;
            document.getElementById("bigo-status").className = "text-center font-bold text-emerald-400 text-xs";
        };

        window.sendWhatsAppDeposit = function() {
            const amt = document.getElementById("dep-amt").value;
            const tid = document.getElementById("dep-tid").value;
            window.open(`https://wa.me/923256590936?text=Bigo%20Deposit%0AUser:${currentUser}%0AAmount:${amt}%0ATID:${tid}`, '_blank');
        };

        window.sendWhatsAppWithdrawal = function() {
            const amt = document.getElementById("w-amt").value;
            const acc = document.getElementById("w-acc").value;
            window.open(`https://wa.me/923256590936?text=Bigo%20Withdraw%0AUser:${currentUser}%0AAmount:${amt}%0AAccount:${acc}`, '_blank');
        };
    </script>
</head>
<body class="bg-[#0f0b1e] text-white min-h-screen flex flex-col items-center p-3 font-sans">

    <!-- Auth Section -->
    <div id="auth-screen" class="w-full max-w-sm bg-[#1a1333] border border-purple-900 rounded-3xl p-6 shadow-2xl mt-12">
        <div class="text-center mb-6">
            <span class="text-3xl">🎡</span>
            <h1 class="text-2xl font-black text-amber-400 tracking-wider">BIGO GREEDY WHEEL</h1>
            <p class="text-xs text-purple-300 mt-1">8-Option Live Arena</p>
        </div>
        <input type="text" id="username-input" placeholder="Bigo ID / Username" class="w-full bg-[#120c24] border border-purple-800 rounded-xl p-3 text-sm text-white mb-3 focus:outline-none focus:border-amber-400">
        <input type="password" id="password-input" placeholder="Security Password" class="w-full bg-[#120c24] border border-purple-800 rounded-xl p-3 text-sm text-white mb-5 focus:outline-none focus:border-amber-400">
        <button onclick="loginUser()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-extrabold py-3 rounded-xl shadow-lg text-sm">Enter Live Room</button>
    </div>

    <!-- Game Room Screen -->
    <div id="game-screen" class="hidden w-full max-w-sm space-y-4">
        <!-- Top Bar -->
        <div class="bg-[#1a1333] border border-purple-900/60 rounded-2xl p-3 flex justify-between items-center shadow-md">
            <div>
                <p class="text-[10px] text-purple-400">Live Host</p>
                <h2 id="display-username" class="font-bold text-amber-300 text-sm"></h2>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-purple-400">Diamonds</p>
                <h2 id="display-balance" class="font-bold text-emerald-400 text-base">💎 0.00</h2>
            </div>
            <button onclick="logoutUser()" class="text-[10px] bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2.5 py-1 rounded-lg">Exit</button>
        </div>

        <!-- Wheel Arena Card -->
        <div class="bg-[#1a1333] border border-purple-900/80 rounded-3xl p-4 shadow-xl flex flex-col items-center space-y-3 relative overflow-hidden">
            <div class="absolute top-2 left-3 bg-purple-950/80 px-2.5 py-0.5 rounded-full border border-purple-700 text-[10px] text-amber-300 font-bold">🔴 LIVE WHEEL</div>
            
            <!-- Wheel Center Display -->
            <div class="w-full h-32 bg-[#0c0817] border border-purple-900 rounded-2xl flex flex-col items-center justify-center shadow-inner mt-4 relative">
                <div class="absolute inset-0 bg-gradient-to-t from-amber-500/10 to-transparent rounded-2xl"></div>
                <span id="wheel-center-display" class="text-2xl font-black text-amber-400 tracking-wider z-10 drop-shadow-[0_0_15px_rgba(251,191,36,0.5)]">READY</span>
                <span id="bigo-status" class="text-center font-bold text-xs text-amber-400 mt-1 z-10">Waiting for next spin...</span>
            </div>

            <!-- 8 Options Grid (Left 4 Vegs @ 5x, Right 4 Foods @ 10x, 15x, 25x, 45x) -->
            <div class="w-full grid grid-cols-4 gap-1.5">
                <button id="opt-0" onclick="selectBetOption(0, 'Veg 1', 5)" class="option-btn bg-[#120c24] border border-purple-800 rounded-xl p-2 text-center transition">
                    <div class="text-lg">🥦</div>
                    <div class="text-[10px] text-amber-300 font-bold">5x</div>
                </button>
                <button id="opt-1" onclick="selectBetOption(1, 'Veg 2', 5)" class="option-btn bg-[#120c24] border border-purple-800 rounded-xl p-2 text-center transition">
                    <div class="text-lg">🥕</div>
                    <div class="text-[10px] text-amber-300 font-bold">5x</div>
                </button>
                <button id="opt-2" onclick="selectBetOption(2, 'Veg 3', 5)" class="option-btn bg-[#120c24] border border-purple-800 rounded-xl p-2 text-center transition">
                    <div class="text-lg">🍅</div>
                    <div class="text-[10px] text-amber-300 font-bold">5x</div>
                </button>
                <button id="opt-3" onclick="selectBetOption(3, 'Veg 4', 5)" class="option-btn bg-[#120c24] border border-purple-800 rounded-xl p-2 text-center transition">
                    <div class="text-lg">🌽</div>
                    <div class="text-[10px] text-amber-300 font-bold">5x</div>
                </button>
                <button id="opt-4" onclick="selectBetOption(4, 'Burger', 10)" class="option-btn bg-[#120c24] border border-purple-800 rounded-xl p-2 text-center transition">
                    <div class="text-lg">🍔</div>
                    <div class="text-[10px] text-amber-400 font-bold">10x</div>
                </button>
                <button id="opt-5" onclick="selectBetOption(5, 'Kabab Stick', 15)" class="option-btn bg-[#120c24] border border-purple-800 rounded-xl p-2 text-center transition">
                    <div class="text-lg">🍢</div>
                    <div class="text-[10px] text-amber-400 font-bold">15x</div>
                </button>
                <button id="opt-6" onclick="selectBetOption(6, 'Chicken Leg', 25)" class="option-btn bg-[#120c24] border border-purple-800 rounded-xl p-2 text-center transition">
                    <div class="text-lg">🍗</div>
                    <div class="text-[10px] text-amber-400 font-bold">25x</div>
                </button>
                <button id="opt-7" onclick="selectBetOption(7, 'Meat', 45)" class="option-btn bg-[#120c24] border border-purple-800 rounded-xl p-2 text-center transition">
                    <div class="text-lg">🥩</div>
                    <div class="text-[10px] text-amber-400 font-bold">45x</div>
                </button>
            </div>

            <div id="selected-target-text" class="text-[11px] text-purple-300 font-semibold">Select an item to place bet</div>

            <!-- Bet Input & Button -->
            <div class="w-full space-y-2">
                <input type="number" id="user-bet-input" value="100" class="w-full bg-[#120c24] border border-purple-800 rounded-xl p-2.5 text-xs text-white font-bold text-center focus:outline-none focus:border-amber-400" placeholder="Bet Amount">
            </div>

            <div class="grid grid-cols-2 gap-2 w-full">
                <button onclick="placeWheelBet()" class="bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-black py-2.5 rounded-xl shadow-lg text-xs uppercase tracking-wider">Place Bet</button>
                <button onclick="window.location.reload()" class="bg-[#120c24] border border-purple-800 text-purple-300 font-bold py-2.5 rounded-xl text-xs">Refresh</button>
            </div>

            <!-- Live Bot Ticker -->
            <div class="w-full bg-[#0c0817] border border-purple-900/50 rounded-xl p-2.5 h-14 overflow-hidden text-[10px] text-purple-300">
                <div id="bigo-bot-feed" class="space-y-0.5">
                    <span class="text-purple-500">Syncing room activity...</span>
                </div>
            </div>
        </div>

        <!-- Deposit / Withdraw Section -->
        <div class="bg-[#1a1333] border border-purple-900/60 rounded-2xl p-4 space-y-3">
            <h3 class="font-bold text-xs text-amber-400">💎 Diamond Recharge (0325-6590936)</h3>
            <input type="number" id="dep-amt" placeholder="Diamonds / PKR Amount" class="w-full bg-[#120c24] border border-purple-800 rounded-xl p-2 text-xs text-white">
            <input type="text" id="dep-tid" placeholder="Transaction ID (TID)" class="w-full bg-[#120c24] border border-purple-800 rounded-xl p-2 text-xs text-white">
            <button onclick="sendWhatsAppDeposit()" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs">WhatsApp Deposit Request</button>
        </div>

        <div class="bg-[#1a1333] border border-purple-900/60 rounded-2xl p-4 space-y-3">
            <h3 class="font-bold text-xs text-amber-400">💸 Cashout / Withdraw</h3>
            <input type="number" id="w-amt" placeholder="Withdraw Amount" class="w-full bg-[#120c24] border border-purple-800 rounded-xl p-2 text-xs text-white">
            <input type="text" id="w-acc" placeholder="Easypaisa/JazzCash Number" class="w-full bg-[#120c24] border border-purple-800 rounded-xl p-2 text-xs text-white">
            <button onclick="sendWhatsAppWithdrawal()" class="w-full bg-amber-500 text-slate-950 font-bold py-2 rounded-xl text-xs">WhatsApp Withdraw Request</button>
