<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Win Arena - P2P Gaming</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #38bdf8; }
        .card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        .btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit {
            background: #22c55e;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        .deposit-info {
            text-align: left;
            font-size: 14px;
            background: #1e293b;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #f59e0b;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔥 Lucky Win Arena</h2>
    
    <div class="card">
        <h3>Wallet Balance: <span id="balance">0.00</span> PKR</h3>
    </div>

    <div class="card">
        <h3>Greedy Multiplier</h3>
        <p id="game-status">Click Spin to Play</p>
        <button class="btn" onclick="playGame()">SPIN (Cost: 100 PKR)</button>
    </div>

    <div class="card" style="text-align: left;">
        <h3 style="color: #38bdf8; text-align: center; margin-top: 0;">instant Easypaisa Deposit</h3>
        <div class="deposit-info">
            1. Send money to Easypaisa: <b>0325-6590936</b><br>
            (Title: Abdul Raheem)<br>
            2. Enter your Transaction ID (TID) below after sending.
        </div>
        
        <label>Your Easypaisa Number:</label>
        <input type="text" id="userNumber" placeholder="e.g. 03XXXXXXXXX">

        <label>Transaction ID (TID):</label>
        <input type="text" id="userTid" placeholder="Enter 11-digit TID">

        <label>Amount (PKR):</label>
        <input type="number" id="userAmount" placeholder="e.g. 500">

        <button class="btn btn-submit" onclick="submitDeposit()">Submit Deposit Request</button>
    </div>
</div>

<script>
    let balance = 0.00;

    function updateBalance() {
        document.getElementById("balance").innerText = balance.toFixed(2);
    }

    function playGame() {
        if (balance < 100) {
            alert("Insufficient balance! Please deposit funds first.");
            return;
        }
        balance -= 100;
        let multipliers = [0, 0, 1.5, 2, 0, 5, 10, 0];
        let rand = multipliers[Math.floor(Math.random() * multipliers.length)];
        
        if (rand > 0) {
            let winAmount = 100 * rand;
            balance += winAmount;
            document.getElementById("game-status").innerText = `🎉 You Won ${winAmount} PKR (${rand}x)!`;
        } else {
            document.getElementById("game-status").innerText = "❌ Better luck next time!";
        }
        updateBalance();
    }

    function submitDeposit() {
        let number = document.getElementById("userNumber").value;
        let tid = document.getElementById("userTid").value;
        let amount = document.getElementById("userAmount").value;

        if (!number || !tid || !amount) {
            alert("Please fill in all fields!");
            return;
        }

        let adminWhatsapp = "923256590936";
        let message = `*New Deposit Request*%0A- Sender Number: ${number}%0A- Amount: ${amount} PKR%0A- TID: ${tid}`;
        
        let whatsappUrl = `https://wa.me/${adminWhatsapp}?text=${message}`;
        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
