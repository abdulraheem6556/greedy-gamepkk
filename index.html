<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Win Arena - Secure Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2uxfVYbNrksWicBrB-g-Ww81u6A70e28",
            authDomain: "greedygamepkk.firebaseapp.com",
            databaseURL: "https://greedygamepkk-default-rtdb.firebaseio.com",
            projectId: "greedygamepkk",
            storageBucket: "greedygamepkk.appspot.com",
            messagingSenderId: "658430310829",
            appId: "1:658430310829:web:69b827e7f9a1f2e9619a89"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = localStorage.getItem("lucky_win_user") || "";
        let gameInterval = null;
        let currentMultiplier = 1.00;
        let activeBet = 0;
        let isPlaying = false;

        window.addEventListener("DOMContentLoaded", () => {
            if (currentUser) {
                document.getElementById("auth-screen").classList.add("hidden");
                document.getElementById("game-screen").classList.remove("hidden");
                document.getElementById("display-username").innerText = currentUser;
                listenToBalance(currentUser);
            }
        });

        window.loginUser = function() {
            const usernameInput = document.getElementById("username-input").value.trim();
            const passwordInput = document.getElementById("password-input").value.trim();
            
            if (!usernameInput || !passwordInput) {
                alert("Please enter both username and password!");
                return;
            }

            const userRef = ref(db, 'users/' + usernameInput);
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    if (userData.password === passwordInput) {
                        currentUser = usernameInput;
                        localStorage.setItem("lucky_win_user", currentUser);
                        document.getElementById("auth-screen").classList.add("hidden");
                        document.getElementById("game-screen").classList.remove("hidden");
                        document.getElementById("display-username").innerText = currentUser;
                        listenToBalance(currentUser);
                    } else {
                        alert("❌ Incorrect password!");
                    }
                } else {
                    // Register new user with password & starting balance
                    set(userRef, { 
                        password: passwordInput, 
                        balance: 100.00 
                    });
                    currentUser = usernameInput;
                    localStorage.setItem("lucky_win_user", currentUser);
                    document.getElementById("auth-screen").classList.add("hidden");
                    document.getElementById("game-screen").classList.remove("hidden");
                    document.getElementById("display-username").innerText = currentUser;
                    listenToBalance(currentUser);
                }
            });
        };

        window.logoutUser = function() {
            localStorage.removeItem("lucky_win_user");
            location.reload();
        };

        function listenToBalance(username) {
            const balanceRef = ref(db, 'users/' + username + '/balance');
            onValue(balanceRef, (snapshot) => {
                const balance = snapshot.val() !== null ? snapshot.val() : 0;
                document.getElementById("display-balance").innerText = "PKR " + parseFloat(balance).toFixed(2);
                window.currentBalance = parseFloat(balance);
            });
        }

        window.startGreedyGame = async function() {
            const betAmount = parseFloat(document.getElementById("bet-amount").value);
            const statusEl = document.getElementById("game-status");
            const multiplierDisplay = document.getElementById("multiplier-display");
            const startBtn = document.getElementById("start-btn");
            const cashoutBtn = document.getElementById("cashout-btn");

            if (isNaN(betAmount) || betAmount <= 0) {
                statusEl.innerText = "⚠️ Enter a valid bet amount!";
                return;
            }

            if (betAmount > window.currentBalance) {
                statusEl.innerText = "❌ Insufficient balance! Please deposit.";
                return;
            }

            activeBet = betAmount;
            let newBalance = window.currentBalance - activeBet;
            const userRef = ref(db, 'users/' + currentUser);
            await update(userRef, { balance: newBalance });

            isPlaying = true;
            currentMultiplier = 1.00;
            multiplierDisplay.innerText = "1.00x";
            statusEl.innerText = "🚀 Greedy Game Started! Watch out...";
            statusEl.className = "text-center font-bold text-yellow-400 animate-pulse";

            startBtn.classList.add("hidden");
            cashoutBtn.classList.remove("hidden");

            const crashPoint = parseFloat((Math.random() * (5.0 - 1.2) + 1.2).toFixed(2));

            gameInterval = setInterval(() => {
                currentMultiplier += 0.05;
                multiplierDisplay.innerText = currentMultiplier.toFixed(2) + "x";

                if (currentMultiplier >= crashPoint) {
                    clearInterval(gameInterval);
                    if (isPlaying) {
                        isPlaying = false;
                        statusEl.innerText = `💥 CRASHED! You lost PKR ${activeBet}`;
                        statusEl.className = "text-center font-bold text-red-500";
                        cashoutBtn.classList.add("hidden");
                        startBtn.classList.remove("hidden");
                    }
                }
            }, 150);
        };

        window.cashOut = async function() {
            if (!isPlaying) return;
            clearInterval(gameInterval);
            isPlaying = false;

            const statusEl = document.getElementById("game-status");
            const startBtn = document.getElementById("start-btn");
            const cashoutBtn = document.getElementById("cashout-btn");

            const winAmount = activeBet * currentMultiplier;
            let newBalance = window.currentBalance + winAmount;

            const userRef = ref(db, 'users/' + currentUser);
            await update(userRef, { balance: newBalance });

            statusEl.innerText = `🎉 Successful Cashout! Won PKR ${winAmount.toFixed(2)} at ${currentMultiplier.toFixed(2)}x`;
            statusEl.className = "text-center font-bold text-emerald-400";

            cashoutBtn.classList.add("hidden");
            startBtn.classList.remove("hidden");
        };

        window.sendWhatsAppDeposit = function() {
            const amount = document.getElementById("deposit-amount").value;
            const tid = document.getElementById("deposit-tid").value.trim();
            if (!amount || !tid) { alert("Enter Amount and TID!"); return; }
            const message = `Hello Admin, Deposit Request.%0A*User:* ${currentUser}%0A*Amount:* PKR ${amount}%0A*TID:* ${tid}`;
            window.open(`https://wa.me/923256590936?text=${message}`, '_blank');
        };

        window.sendWhatsAppWithdrawal = function() {
            const amount = document.getElementById("withdraw-amount").value;
            const accountNo = document.getElementById("withdraw-account").value.trim();
            const method = document.getElementById("withdraw-method").value;
            if (!amount || !accountNo) { alert("Enter amount and account number!"); return; }
            if (parseFloat(amount) > window.currentBalance) { alert("Exceeds balance!"); return; }
            const message = `Hello Admin, Withdrawal Request.%0A*User:* ${currentUser}%0A*Amount:* PKR ${amount}%0A*Method:* ${method}%0A*Account:* ${accountNo}`;
            window.open(`https://wa.me/923256590936?text=${message}`, '_blank');
        };
    </script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-start p-4">

    <!-- Auth Screen with Password -->
    <div id="auth-screen" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl mt-10">
        <h1 class="text-3xl font-extrabold text-center text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-6">Lucky Win Arena</h1>
        <p class="text-slate-400 text-center mb-6 text-sm">Enter your username and password to login or register!</p>
        <input type="text" id="username-input" placeholder="Username (e.g. Raheem)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white mb-3 focus:outline-none focus:border-cyan-400">
        <input type="password" id="password-input" placeholder="Password" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white mb-4 focus:outline-none focus:border-cyan-400">
        <button onclick="loginUser()" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-bold py-3 rounded-xl shadow-lg">Login / Register</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden w-full max-w-md space-y-6">
        <!-- Header Info -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex justify-between items-center shadow-lg">
            <div>
                <p class="text-xs text-slate-400">Player</p>
                <h2 id="display-username" class="font-bold text-cyan-400 text-lg"></h2>
            </div>
            <div class="text-right">
                <p class="text-xs text-slate-400">Balance</p>
                <h2 id="display-balance" class="font-bold text-emerald-400 text-xl">PKR 0.00</h2>
            </div>
            <button onclick="logoutUser()" class="text-xs bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg">Logout</button>
        </div>

        <!-- Greedy Multiplier Arena -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg flex flex-col items-center space-y-4">
            <h3 class="font-bold text-lg text-amber-400">🔥 Greedy Multiplier Game</h3>
            
            <div class="w-full h-36 bg-slate-950 border border-slate-800 rounded-xl flex flex-col items-center justify-center shadow-inner">
                <span id="multiplier-display" class="text-5xl font-black text-emerald-400 tracking-wider">1.00x</span>
                <span class="text-xs text-slate-500 mt-2">Cash out before it crashes!</span>
            </div>

            <div class="w-full">
                <label class="text-xs text-slate-400 mb-1 block">Bet Amount (PKR)</label>
                <input type="number" id="bet-amount" value="100" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white font-bold focus:outline-none focus:border-cyan-400">
            </div>

            <button id="start-btn" onclick="startGreedyGame()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition text-base">Place Bet & Start</button>
            <button id="cashout-btn" onclick="cashOut()" class="hidden w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition text-base animate-bounce">CASHOUT NOW</button>

            <div id="game-status" class="text-center font-bold text-sm h-6">Ready to play? Place your bet!</div>
        </div>

        <!-- Deposit Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg space-y-4">
            <h3 class="font-bold text-sm text-cyan-400">Deposit via Easypaisa (0325-6590936)</h3>
            <div class="space-y-3">
                <input type="number" id="deposit-amount" placeholder="Amount (PKR)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white">
                <input type="text" id="deposit-tid" placeholder="Transaction ID (TID)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white">
                <button onclick="sendWhatsAppDeposit()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm">Send WhatsApp Deposit Request</button>
            </div>
        </div>

        <!-- Withdrawal Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg space-y-4">
            <h3 class="font-bold text-sm text-amber-400">Withdraw Funds</h3>
            <div class="space-y-3">
                <input type="number" id="withdraw-amount" placeholder="Withdraw Amount (PKR)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white">
                <select id="withdraw-method" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white">
                    <option value="Easypaisa">Easypaisa</option>
                    <option value="JazzCash">JazzCash</option>
                </select>
                <input type="text" id="withdraw-account" placeholder="Account Number" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white">
                <button onclick="sendWhatsAppWithdrawal()" class="w-full bg-amber-500 text-slate-950 font-bold py-3 rounded-xl text-sm">Send WhatsApp Withdrawal Request</button>
            </div>
        </div>
    </div>

</body>
</html>
