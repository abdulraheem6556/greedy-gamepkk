<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Spin & Deposit - P2P Gaming</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 15px;
        }
        .balance-box {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .balance-box span {
            color: #4ade80;
            font-weight: bold;
        }
        .game-area {
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .btn {
            background: #f59e0b;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover {
            background: #d97706;
        }
        .deposit-section {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
        }
        .deposit-section h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        .instruction {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
        }
        .submit-btn {
            background: #22c55e;
            color: #fff;
        }
        .submit-btn:hover {
            background: #16a34a;
        }
        #result-msg {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔥 Lucky Win Arena</h2>
        
        <!-- User Balance Display -->
        <div class="balance-box">
            Wallet Balance: <span id="user-balance">0.00</span> PKR
        </div>

        <!-- Game Simulation Area -->
        <div class="game-area">
            <h3>Greedy Multiplier</h3>
            <p id="game-status" style="font-size: 24px; margin: 15px 0; color: #facc15;">Click Spin to Play</p>
            <button class="btn" onclick="playGame()">SPIN (Cost: 100 PKR)</button>
        </div>

        <!-- P2P Easypaisa Deposit Section -->
        <div class="deposit-section">
            <h3>💳 Instant Easypaisa Deposit</h3>
            <div class="instruction">
                1. Send money to Easypaisa: <b>0300-1234567</b> (Title: Abdul Raheem)<br>
                2. Enter your Transaction ID (TID) below after sending.
            </div>
            
            <div class="form-group">
                <label>Your Easypaisa Number:</label>
                <input type="text" id="sender-number" placeholder="03XXXXXXXXX">
            </div>

            <div class="form-group">
                <label>Transaction ID (TID):</label>
                <input type="text" id="tid-input" placeholder="Enter 11-digit TID">
            </div>

            <div class="form-group">
                <label>Amount (PKR):</label>
                <input type="number" id="deposit-amount" placeholder="e.g. 500">
            </div>

            <button class="btn submit-btn" onclick="submitDeposit()">Submit Deposit Request</button>
            <p id="result-msg"></p>
        </div>
    </div>

    <script>
        let balance = 0;

        function playGame() {
            if (balance < 100) {
                alert("Aapka balance kam hai! Pehle deposit karein.");
                return;
            }
            balance -= 100;
            document.getElementById("user-balance").innerText = balance.toFixed(2);
            
            let status = document.getElementById("game-status");
            status.innerText = "Spinning...";
            
            setTimeout(() => {
                let win = Math.random() > 0.5; // 50% chance
                if (win) {
                    let prize = 200;
                    balance += prize;
                    status.innerText = `🎉 You Won ${prize} PKR!`;
                } else {
                    status.innerText = "❌ You Lost! Try Again.";
                }
                document.getElementById("user-balance").innerText = balance.toFixed(2);
                
            }, 1000);
        }

        function submitDeposit() {
            let number = document.getElementById("sender-number").value;
            let tid = document.getElementById("tid-input").value;
            let amount = document.getElementById("deposit-amount").value;
            let msg = document.getElementById("result-msg");

            if (number === "" || tid === "" || amount === "") {
                msg.style.color = "#f87171";
                msg.innerText = "Bhai, saari fields fill karna lazmi hain!";
                return;
            }

            // Yahan par aap baad mein backend/database ka code lagayenge jo yeh TID aapke admin panel tak pohchayega.
            msg.style.color = "#4ade80";
            msg.innerText = "Request submit ho gayi! Agent verification ke baad balance add ho jayega.";
            
            // Clear inputs
            document.getElementById("sender-number").value = "";
            document.getElementById("tid-input").value = "";
            document.getElementById("deposit-amount").value = "";
        }
    </script>

</body>
</html>
